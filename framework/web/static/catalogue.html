<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* the catalogue page. Same tokens as the studio page (index.html) and the other pages: layout dye on steel.
     Square corners, flat surfaces, elevation by dye level. */
  :root{
    --dye-900:#0B1322; --dye-800:#101B31; --dye-700:#152442; --dye-600:#1C3059;
    --rule:#243757; --rule-strong:#33507F;
    --steel:#B9C3D3; --steel-dim:#7C8AA3; --scribe:#EAF1FA; --scribe-blue:#7FB3FF;
    --brass:#D9A441; --ok:#62C48A; --bad:#E0646C;
    --display:"Barlow Condensed",system-ui,sans-serif;
    --body:"Barlow",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --panel-w:460px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--dye-900);color:var(--steel);font:15px/1.5 var(--body)}
  :focus-visible{outline:2px solid var(--scribe-blue);outline-offset:2px}
  a{color:var(--scribe-blue)}
  #sheet{margin:12px;border:1px solid var(--rule-strong);position:relative;min-height:calc(100vh - 24px)}
  #sheet::before{content:"";position:absolute;inset:6px;border:1px solid var(--rule);pointer-events:none}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;padding:22px 26px 14px;border-bottom:1px solid var(--rule)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--steel-dim);text-transform:uppercase}
  h1{margin:2px 0 0;font-family:var(--display);font-weight:600;font-size:28px;color:var(--scribe);letter-spacing:.01em;line-height:1.1}
  #meta{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--steel-dim);text-align:right}
  #meta b{color:var(--scribe);font-weight:500}
  main{padding:16px 26px 28px;position:relative}

  /* the one search box: the landing page's ask box */
  #find{display:flex;width:100%;max-width:820px;background:var(--dye-800);border:1px solid var(--rule-strong)}
  #find input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--scribe);font:17px var(--body);padding:12px 14px}
  #find input::placeholder{color:var(--steel-dim)}
  #find button{background:var(--scribe);color:var(--dye-900);border:0;padding:0 20px;font-family:var(--display);font-weight:600;
    font-size:16px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  #find button:hover{background:#fff}
  #find:focus-within{border-color:var(--scribe-blue)}
  #hint{min-height:22px;margin:6px 0 10px;font-family:var(--mono);font-size:12px;color:var(--steel-dim)}
  #hint.warn{color:var(--brass)}

  /* filters */
  #filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;margin:0 0 14px;padding:10px 12px;border:1px solid var(--rule);background:var(--dye-800)}
  #filters .f{display:flex;flex-direction:column;gap:3px;min-width:0}
  #filters .f > span{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel-dim)}
  #filters .pair{display:flex;align-items:center;gap:4px}
  #filters .pair i{font-style:normal;color:var(--steel-dim);font-family:var(--mono);font-size:12px}
  #filters input,#filters select{background:var(--dye-700);color:var(--scribe);border:1px solid var(--rule-strong);border-radius:0;
    font:12.5px var(--mono);padding:5px 6px;height:30px}
  #filters input{width:78px}
  #filters select{max-width:200px}
  #filters input:focus-visible,#filters select:focus-visible{outline:2px solid var(--scribe-blue);outline-offset:1px}
  .tbtn{background:rgba(11,19,34,.6);border:1px solid var(--rule-strong);color:var(--steel);font-family:var(--display);font-weight:600;font-size:12px;
    letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;min-width:28px;line-height:1.5;text-align:center;text-decoration:none;cursor:pointer;white-space:nowrap}
  .tbtn:hover{border-color:var(--scribe-blue);color:var(--scribe)} .tbtn:disabled{opacity:.4;cursor:default;border-color:var(--rule-strong)}
  #fClear{height:30px}
  #fToggle{display:none;margin:0 0 10px}

  /* parts | assemblies */
  #tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:8px}
  #tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--steel-dim);font-family:var(--display);font-weight:600;
    font-size:15px;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px 5px;cursor:pointer}
  #tabs button[aria-selected=true]{color:var(--scribe);border-bottom-color:var(--scribe-blue)}
  #tabs button:hover{color:var(--scribe)}
  #tabs .c{font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:0;color:var(--steel-dim);margin-left:4px}
  #summary{font-family:var(--mono);font-size:11.5px;color:var(--steel-dim);margin:2px 0 10px;overflow-wrap:anywhere}
  #summary b{color:var(--scribe);font-weight:500}

  /* result rows */
  #results{display:grid;gap:6px}
  .hit{display:block;background:var(--dye-800);border:1px solid var(--rule);padding:9px 12px;color:var(--steel);text-decoration:none;cursor:pointer;min-width:0}
  .hit:hover,.hit:focus-within{background:var(--dye-700);border-color:var(--rule-strong)}
  .hit.on{background:var(--dye-600);box-shadow:inset 2px 0 0 var(--scribe-blue)}
  .hit .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
  .hit .nm{background:none;border:0;padding:0;cursor:pointer;text-align:left;font-family:var(--display);font-weight:600;font-size:16px;
    letter-spacing:.04em;text-transform:uppercase;color:var(--scribe);overflow-wrap:anywhere;min-width:0}
  .hit .fam{font-family:var(--mono);font-size:11px;color:var(--steel-dim);border:1px solid var(--rule-strong);padding:0 6px;white-space:nowrap}
  .hit .dist{font-family:var(--mono);font-size:11.5px;color:var(--brass)}
  .hit .nums{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:4px;font-family:var(--mono);font-size:12.5px;color:var(--steel)}
  .hit .nums .k{color:var(--steel-dim)}
  .hit .num{color:var(--scribe)}
  .hit .num.lit{color:var(--brass)}
  .hit .more{color:var(--steel-dim)}
  .hit .use{margin-top:3px;font-size:13px;color:var(--steel-dim);overflow-wrap:anywhere}
  .hit .use b{color:var(--steel);font-weight:500}
  .hit .go{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--scribe-blue)}
  /* designs whose name holds every word of the box, above the parts (typing a design's name finds it at once) */
  #named{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 8px;padding:7px 12px;border:1px solid var(--rule-strong);
    background:var(--dye-700);font-size:13.5px;overflow-wrap:anywhere}
  #named[hidden]{display:none}
  #named .k{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel-dim)}
  #named a{color:var(--scribe-blue);text-decoration:none;min-width:0} #named a:hover{color:var(--scribe);text-decoration:underline}
  #empty{padding:26px 6px;color:var(--steel-dim);font-family:var(--display);font-size:18px;letter-spacing:.04em;text-transform:uppercase}
  #pager{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--steel-dim)}
  #pager[hidden]{display:none}

  /* the part view: fixed on the right over the list; the part turning in 3D on the left, its numbers on the
     right. The panel keys (h2, .num[data-k], a.filelink "View in studio") stay as they were. */
  #detail{position:fixed;top:0;right:0;bottom:0;width:min(1180px,calc(100vw - 56px));z-index:40;background:var(--dye-800);
    border-left:1px solid var(--rule-strong);overflow-y:auto;overflow-x:hidden;padding:18px 20px 24px}
  #detail[hidden]{display:none}
  #detail .dh{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 12px;border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:12px}
  #detail .dh > div:first-child{flex:1 1 260px;min-width:0}
  #detail .acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  #detail h2{margin:2px 0 2px;font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.03em;text-transform:uppercase;color:var(--scribe);
    line-height:1.15;overflow-wrap:anywhere}
  #detail .sub{font-family:var(--mono);font-size:11.5px;color:var(--steel-dim);overflow-wrap:anywhere}
  #detail .crumb{background:none;border:0;padding:0;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--scribe-blue);cursor:pointer;text-align:left;overflow-wrap:anywhere}
  #detail .crumb:hover{color:var(--scribe);text-decoration:underline}
  #detail .x{background:transparent;border:1px solid var(--rule-strong);color:var(--steel-dim);font-size:15px;width:32px;height:32px;cursor:pointer;flex:none}
  #detail .x:hover{color:var(--scribe);border-color:var(--scribe-blue)}
  #detail .act{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--scribe-blue);
    background:rgba(11,19,34,.6);border:1px solid var(--rule-strong);padding:5px 11px;text-decoration:none;white-space:nowrap;line-height:1.4}
  #detail .act:hover{border-color:var(--scribe-blue);color:var(--scribe)}
  #detail .pv{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
  #detail .stage{position:sticky;top:0;height:min(640px,calc(100vh - 120px));min-height:300px;background:var(--dye-900);border:1px solid var(--rule-strong);overflow:hidden}
  #detail .stage canvas{display:block;width:100%;height:100%;touch-action:none}
  #detail .vt{position:absolute;left:8px;top:8px;display:flex;flex-wrap:wrap;gap:4px;z-index:2;max-width:calc(100% - 16px)}
  #detail .vt .tbtn{padding:2px 7px;font-size:11.5px}
  #detail .vmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;
    font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-dim);pointer-events:none}
  #detail .vmsg[hidden]{display:none}
  #detail .vhint{position:absolute;left:8px;bottom:6px;right:8px;font-family:var(--mono);font-size:10.5px;color:var(--steel-dim);pointer-events:none}
  #detail .facts{min-width:0}
  #detail .desc{margin:0 0 10px;font-size:14px;color:var(--steel)}
  #detail .desc[hidden]{display:none}
  #detail dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0 0 6px;font-family:var(--mono);font-size:12.5px}
  #detail dt{color:var(--steel-dim)} #detail dd{margin:0;text-align:right;color:var(--scribe);overflow-wrap:anywhere}
  #detail dd .u{color:var(--steel-dim)}
  #detail h3{margin:14px 0 6px;padding-top:8px;border-top:1px solid var(--rule);font-family:var(--display);font-weight:600;font-size:13px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--steel-dim)}
  #detail .facts > h3:first-child{margin-top:0;padding-top:0;border-top:0}
  #detail table{border-collapse:collapse;font-family:var(--mono);font-size:12.5px;max-width:100%}
  #detail th{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel-dim);text-align:left;padding:0 14px 3px 0}
  #detail td{padding:2px 14px 2px 0;color:var(--scribe);vertical-align:top} #detail td.c{color:var(--steel-dim)}
  #detail table.parts{width:100%}
  #detail table.parts td{border-top:1px solid var(--rule);padding:5px 10px 5px 0}
  #detail table.parts tr:hover td{background:var(--dye-700)}
  #detail table.parts .lnk{font-family:var(--body);font-size:13.5px}
  #detail ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  #detail li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:13.5px;overflow-wrap:anywhere}
  #detail li .dn{color:var(--steel);min-width:0}
  #detail .fam{font-family:var(--mono);font-size:11px;color:var(--steel-dim);border:1px solid var(--rule-strong);padding:0 6px;white-space:nowrap}
  #detail button.lnk{background:none;border:0;padding:0;color:var(--scribe-blue);font:inherit;cursor:pointer;text-align:left;overflow-wrap:anywhere}
  #detail button.lnk:hover{color:var(--scribe);text-decoration:underline}
  #detail .filelink{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--scribe-blue);
    border:1px solid var(--rule-strong);padding:1px 8px;text-decoration:none;white-space:nowrap}
  #detail .filelink:hover{border-color:var(--scribe-blue);color:var(--scribe)}
  #detail .note{margin-top:6px;font-size:12px;color:var(--steel-dim)}
  #detail ul.conn li, #detail ul.use li{display:block;font-size:13px;line-height:1.45}
  #detail ul.use{margin:4px 0 2px 14px;width:100%;gap:2px}
  #detail .msg{padding:20px 0;color:var(--steel-dim)}
  @media (max-width:900px){
    #detail .pv{grid-template-columns:minmax(0,1fr)}
    #detail .stage{position:relative;height:340px}
  }
  @media (max-width:700px){
    #detail .stage{height:300px}
    #detail table.parts th:nth-child(2),#detail table.parts td:nth-child(2){display:none}   /* the family column folds on a phone */
    #detail table.parts td,#detail table.parts th{padding-right:6px}
  }

  @media (max-width:700px){
    header,main{padding-left:16px;padding-right:16px}
    #meta{margin-left:0;text-align:left}
    #fToggle{display:inline-block}
    #filters:not(.open){display:none}          /* on a phone the filters fold behind their button: the results come first */
    #filters select{max-width:100%}
    #detail{top:44px;width:100vw;border-left:0;border-top:1px solid var(--rule-strong);padding:14px 16px 24px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

}}

<body>
<div id="sheet">
  <header>
    <div>
      <div class="eyebrow">Parts catalogue - every part and assembly, measured</div>
      <h1>Catalogue</h1>
    </div>
    <div id="meta"><b id="mParts">-</b> parts &middot; <b id="mDesigns">-</b> designs</div>
  </header>
  <main>
    <form id="find" role="search">
      <input id="q" type="search" placeholder="bore 20 · od 60 · family shaft · casing" aria-label="Search the catalogue"
        autocomplete="off" spellcheck="false">
      <button type="submit">Search</button>
    </form>
    <div id="hint" aria-live="polite"></div>
    <button type="button" id="fToggle" class="tbtn" aria-expanded="false" aria-controls="filters">Filters</button>
    <div id="filters" role="group" aria-label="Filters">
      <label class="f"><span>Family</span><select id="fFamily"><option value="">Any family</option></select></label>
      <label class="f"><span>Material</span><select id="fMaterial"><option value="">Any material</option></select></label>
      <div class="f" data-r="bore"><span id="lb-bore">Bore, mm</span><div class="pair">
        <input type="number" step="any" min="0" data-e="min" placeholder="from" aria-labelledby="lb-bore"><i>to</i>
        <input type="number" step="any" min="0" data-e="max" placeholder="to" aria-labelledby="lb-bore"></div></div>
      <div class="f" data-r="od"><span id="lb-od">Outside diameter, mm</span><div class="pair">
        <input type="number" step="any" min="0" data-e="min" placeholder="from" aria-labelledby="lb-od"><i>to</i>
        <input type="number" step="any" min="0" data-e="max" placeholder="to" aria-labelledby="lb-od"></div></div>
      <div class="f" data-r="length"><span id="lb-length">Length, mm</span><div class="pair">
        <input type="number" step="any" min="0" data-e="min" placeholder="from" aria-labelledby="lb-length"><i>to</i>
        <input type="number" step="any" min="0" data-e="max" placeholder="to" aria-labelledby="lb-length"></div></div>
      <div class="f" data-r="width"><span id="lb-width">Width, mm</span><div class="pair">
        <input type="number" step="any" min="0" data-e="min" placeholder="from" aria-labelledby="lb-width"><i>to</i>
        <input type="number" step="any" min="0" data-e="max" placeholder="to" aria-labelledby="lb-width"></div></div>
      <div class="f" data-r="height"><span id="lb-height">Height, mm</span><div class="pair">
        <input type="number" step="any" min="0" data-e="min" placeholder="from" aria-labelledby="lb-height"><i>to</i>
        <input type="number" step="any" min="0" data-e="max" placeholder="to" aria-labelledby="lb-height"></div></div>
      <div class="f" data-r="volume"><span id="lb-volume">Volume, mm³</span><div class="pair">
        <input type="number" step="any" min="0" data-e="min" placeholder="from" aria-labelledby="lb-volume"><i>to</i>
        <input type="number" step="any" min="0" data-e="max" placeholder="to" aria-labelledby="lb-volume"></div></div>
      <div class="f" data-r="mass"><span id="lb-mass">Mass, kg</span><div class="pair">
        <input type="number" step="any" min="0" data-e="min" placeholder="from" aria-labelledby="lb-mass"><i>to</i>
        <input type="number" step="any" min="0" data-e="max" placeholder="to" aria-labelledby="lb-mass"></div></div>
      <div class="f" data-r="holes"><span id="lb-holes">Holes</span><div class="pair">
        <input type="number" step="1" min="0" data-e="min" placeholder="from" aria-labelledby="lb-holes"><i>to</i>
        <input type="number" step="1" min="0" data-e="max" placeholder="to" aria-labelledby="lb-holes"></div></div>
      <label class="f"><span>Identical shapes</span><select id="fSame"><option value="once">Shown once</option><option value="all">Each listed</option></select></label>
      <label class="f"><span>Order</span><select id="fSort">
        <option value="name">Name</option><option value="volume_desc">Volume, largest first</option><option value="volume_asc">Volume, smallest first</option>
        <option value="length_desc">Length, longest first</option><option value="used">Most used</option></select></label>
      <button type="button" id="fClear" class="tbtn">Clear</button>
    </div>
    <div id="tabs" role="tablist" aria-label="Results">
      <button type="button" role="tab" id="tabParts" data-kind="parts" aria-selected="true" aria-controls="results">Parts<span class="c" id="cParts"></span></button>
      <button type="button" role="tab" id="tabAsm" data-kind="assemblies" aria-selected="false" aria-controls="results">Assemblies<span class="c" id="cAsm"></span></button>
    </div>
    <div id="summary" aria-live="polite"></div>
    <div id="named" hidden></div>
    <div id="results" role="tabpanel" aria-labelledby="tabParts"></div>
    <nav id="pager" aria-label="Pages" hidden>
      <button type="button" class="tbtn" id="pPrev">Previous</button><span id="pAt"></span><button type="button" class="tbtn" id="pNext">Next</button>
    </nav>
  </main>
</div>
<aside id="detail" hidden aria-label="Part" tabindex="-1"></aside>
<script>
/* one search box (the studio's phrase reading, window.CatPhrase from catphrase.js), filters, parts and assemblies
   counted and paged. Every read goes to the catalogue service through the gateway (/api/catalogue/*); every number shown is one the
   catalogue answered, only formatted here. The address keeps the search (?q=&family=&...), and #part=<part id> opens a part:
   Catalogue.openPart(id) / Catalogue.renderPart(data) (the part view, its 3D from the part's own view file, its whole
   record, features, designs, identical shapes, its STEP download); #design=<design> opens an assembly's view. */
(function () {
  'use strict';
  const CP = window.CatPhrase;
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const LOC = 'en-US';
  const fmt = (v, d) => Number(v).toLocaleString(LOC, { minimumFractionDigits: d, maximumFractionDigits: d });
  const num = (k, v, d, lit) => v == null ? '<span class="more">—</span>' : `<span class="num${lit ? ' lit' : ''}" data-k="${k}">${fmt(v, d)}</span>`;
  const plural = (n, one, many) => n === 1 ? one : (many || one + 's');
  const PAGE = 25, SHOW_DIAS = 4, SHOW_DESIGNS = 2;
  const RANGES = ['bore', 'od', 'length', 'volume', 'width', 'height', 'mass', 'holes'];
  const state = { q: '', family: '', material: '', ranges: {}, same: 'once', sort: 'name', kind: 'parts', page: 0 };
  let seq = 0, aborter = null, timer = 0, last = null, conds = {}, doneN = 0;
  const finish = () => { results.dataset.done = String(++doneN); };     // a search has drawn its answer (the page check waits on it)
  const box = $('#q'), hintEl = $('#hint'), results = $('#results'), summary = $('#summary'), detail = $('#detail');

  /* ---- the address keeps the search, so a reload or a shared link shows the same list ---- */
  function readUrl() {
    const u = new URLSearchParams(location.search);
    state.q = u.get('q') || ''; state.family = u.get('family') || ''; state.material = u.get('material') || '';
    state.same = u.get('same') === 'all' ? 'all' : 'once';
    state.sort = ['name', 'volume_desc', 'volume_asc', 'length_desc', 'used'].includes(u.get('sort')) ? u.get('sort') : 'name';
    state.kind = u.get('kind') === 'assemblies' ? 'assemblies' : 'parts';

    const ch = p.chamfer_list || [];
    const chamfers = ch.length ? `<table><tr><th>Angle</th><th>Diameter</th><th>Length</th><th>Count</th></tr>${ch.map(x => `<tr><td>${x.angle_deg == null ? '—' : `<span class="num" data-k="ch_angle">${fmt(x.angle_deg, 1)}</span>°`}</td>` +
      `<td>${x.dia_mm == null ? '<span class="more">—</span>' : `Ø<span class="num" data-k="ch_dia">${fmt(x.dia_mm, 2)}</span>`}</td>` +
      `<td>${x.length_mm == null ? '<span class="more">—</span>' : `<span class="num" data-k="ch_len">${fmt(x.length_mm, 2)}</span>`}</td>` +
      `<td class="c">×<span class="num" data-k="ch_n">${x.count}</span></td></tr>`).join('')}</table>` : '<div class="note">None.</div>';
    const designs = usedHtml(p);
    const where = ds => ds.length ? 'in ' + ds.map(x => esc(x.name)).join(', ') : 'in no design yet';
    const ident = p.identical.length ? `<h3>Same shape: <span class="num" data-k="same">${p.identical.length}</span> other ${plural(p.identical.length, 'part')}</h3><ul>${p.identical.slice(0, 40).map(x =>
      `<li><button type="button" class="lnk" data-part="${esc(x.part_id)}">${esc(x.label || x.part_id)}</button><span class="dn">${where(x.designs)}</span></li>`).join('')}</ul>` +
      (p.identical.length > 40 ? `<div class="note">and ${p.identical.length - 40} more</div>` : '') : '';
    const used = p.designs.length ? `used in ${p.designs.length} ${plural(p.designs.length, 'design')}` : 'in no design yet';
    detail.innerHTML = head('Part', esc(p.label || p.part_id), esc((p.family ? p.family + ' · ' : '') + used),
        `<a class="act dlstep" href="/api/catalogue/part/step?id=${enc(p.part_id)}" download>Download as STEP</a>`) +
      `<div class="pv"><section class="stage" aria-label="The part in 3D"><div class="vt" role="toolbar" aria-label="View">` +
      ['fit:Fit', 'in:+', 'out:−', 'front:Front', 'top:Top', 'right:Right', 'iso:Iso'].map(x => { const [v, l] = x.split(':'); return `<button type="button" class="tbtn" data-v="${v}">${l}</button>`; }).join('') +
      `</div><div class="vmsg">Preparing the 3D view…</div><div class="vhint">Drag to turn · right-drag to move · wheel to zoom</div></section>` +
      `<div class="facts">` +
      `<h3>Size and volume</h3><dl>` +
      row('Envelope', e[0] == null ? '—' : `${n('env_a', e[0], 1)} × ${n('env_b', e[1], 1)} × ${n('env_c', e[2], 1)}`, 'mm') +
      (p.exact_size_mm ? row('Exact size', `${n('exact_a', p.exact_size_mm[0], 1)} × ${n('exact_b', p.exact_size_mm[1], 1)} × ${n('exact_c', p.exact_size_mm[2], 1)}`, 'mm') : '') +
      row('Along x', b.length ? span(b[0], b[1], 'box_xmin', 'box_xmax', 2) : '—', 'mm') +
      row('Along y', b.length ? span(b[2], b[3], 'box_ymin', 'box_ymax', 2) : '—', 'mm') +
      row('Along z', b.length ? span(b[4], b[5], 'box_zmin', 'box_zmax', 2) : '—', 'mm') +
      row('Volume', n('volume', p.volume_mm3, 0), 'mm³') + row('Surface area', n('area', p.area_mm2, 0), 'mm²') +
      (p.mass && p.mass.kg != null ? row(p.mass.assumed ? 'Mass, about' : 'Mass', n('mass', p.mass.kg, sigd(p.mass.kg)), 'kg') : '') + `</dl>` +
      (p.mass && p.mass.assumed ? `<div class="note">The mass assumes ${esc(p.mass.material)} (<span class="num" data-k="density">${fmt(p.mass.density_kg_m3, 0)}</span> kg/m³): the part's material is not set.</div>` : '') +
      (p.exact_size_mm ? `<div class="note">Envelope: the quick box the catalogue searches on. Exact size: measured on the part's own shape.</div>` : '') +
      `<h3>Mass properties, per unit density</h3><dl>` +
      row('Centre of mass', trio(['com_x', 'com_y', 'com_z'], c, 2), 'mm') +
      row('Principal moments', trio(['mom_1', 'mom_2', 'mom_3'], m, 0), 'mm⁵') +
      row('Radii of gyration', trio(['gyr_1', 'gyr_2', 'gyr_3'], g, 2), 'mm') + `</dl>` +
      `<h3>Surfaces and topology</h3><dl>` +
      row('Faces', n('faces', p.faces, 0)) + row('Flat faces', n('plane', s.plane, 0)) + row('Round faces', n('cylinder', s.cylinder, 0)) +
      row('Tapers', n('cone', s.cone, 0)) + row('Spherical', n('sphere', s.sphere, 0)) + row('Toroidal', n('torus', s.torus, 0)) +
      row('Freeform', n('bspline', s.bspline, 0)) + row('Other surfaces', n('other_surf', s.other, 0)) +
      row('Edges', n('edges', t.edges, 0)) + row('Vertices', n('vertices', t.vertices, 0)) + row('Solids', n('solids', t.solids, 0)) +
      row('Shells', n('shells', t.shells, 0)) + `</dl>` +
      `<h3>Form</h3><dl>` + row('Box filled', n('fill', q.fill, 3)) + row('Aspect', `${n('aspect_1', q.aspect_1, 3)} · ${n('aspect_2', q.aspect_2, 3)}`) +
      row('Compactness', n('compactness', q.compactness, 3)) + `</dl>` +
      `<h3>Bores (mm)</h3>${diaTable(p.bores, 'bore')}<h3>Outside diameters (mm)</h3>${diaTable(p.ods, 'od')}` +
      `<h3>Chamfers: <span class="num" data-k="chamfers">${p.chamfers}</span></h3>${chamfers}` +
      connects(p) +
      `<h3>Used in <span class="num" data-k="designs">${p.designs.length}</span> ${plural(p.designs.length, 'design')}</h3>${designs}${ident}</div></div>`;
    detail.dataset.part = p.part_id; delete detail.dataset.design;
    wire();
    detail.querySelector('.vt').addEventListener('click', ev => { const btn = ev.target.closest('button[data-v]'); if (btn) viewCmd(btn.dataset.v); });
    detail.querySelector('.x').focus({ preventScroll: true });
  }

  /* ---- the 3D: three.js 0.160.0 (as the studio), loaded the first time a part is opened; one renderer kept for the page ---- */
  let V = null, V3 = null;                      // V: the viewer; V3: what it shows {model, triangles, box, ready}
  async function viewer() {
    if (V) return V;
    const THREE = await import('three');
    const [{ OrbitControls }, { GLTFLoader }, { RoomEnvironment }] = await Promise.all([
      import('three/addons/controls/OrbitControls.js'), import('three/addons/loaders/GLTFLoader.js'), import('three/addons/environments/RoomEnvironment.js')]);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0B1322);
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x1c3059, 1.0));
    const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(3, 5, 4); scene.add(key);
    const fill = new THREE.DirectionalLight(0x7fb3ff, 0.45); fill.position.set(-4, -2, -3); scene.add(fill);
    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100000);
    const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.screenSpacePanning = true;
    V = { THREE, GLTFLoader, renderer, scene, camera, controls, raf: 0, ro: new ResizeObserver(() => resize3d()) };
    return V;
  }
  function resize3d() {
    const st = detail.querySelector('.stage'); if (!V || !st) return;
    const w = st.clientWidth, h = st.clientHeight; if (!w || !h) return;
    V.renderer.setSize(w, h, false); V.camera.aspect = w / h; V.camera.updateProjectionMatrix();
  }
  function loop() {
    if (!V || detail.hidden || !V3) { if (V) V.raf = 0; return; }
    V.controls.update(); V.renderer.render(V.scene, V.camera);
    V.raf = requestAnimationFrame(loop);
  }
  const VIEWS = { front: [0, 0, 1], top: [0, 1, 1e-4], right: [1, 0, 0], iso: [1.5, 1.1, 1.6] };   // three.js axes; the part is Z-up turned Y-up
  function frame(dir) {
    if (!V || !V3) return;
    const { THREE, camera, controls } = V;
    const box = new THREE.Box3().setFromObject(V3.model), c = box.getCenter(new THREE.Vector3());
    const r = Math.max(box.getSize(new THREE.Vector3()).length() / 2, 1e-3);
    const d = (dir ? new THREE.Vector3(...dir) : camera.position.clone().sub(controls.target)).normalize();
    const fov = THREE.MathUtils.degToRad(camera.fov / 2), dist = r / Math.sin(Math.min(fov, fov * camera.aspect)) * 1.08;
    camera.near = dist / 100; camera.far = dist * 50 + r * 20; camera.updateProjectionMatrix();
    controls.target.copy(c); camera.position.copy(c).add(d.multiplyScalar(dist)); controls.update();
  }
  function viewCmd(v) {
    if (!V || !V3) return;
    const { camera, controls } = V;
    if (v === 'fit') frame(null);
    else if (v === 'in' || v === 'out') { const f = v === 'in' ? 1 / 1.4 : 1.4; camera.position.sub(controls.target).multiplyScalar(f).add(controls.target); controls.update(); }
    else frame(VIEWS[v]);
  }
  async function show3d(viewP, mine) {
    const msg = t => { const el = detail.querySelector('.vmsg'); if (el) { el.hidden = !t; el.textContent = t || ''; } };
    const { r, d } = await viewP;
    if (mine !== partSeq) return;
    if (!r || !r.ok || !d.mesh_url) {
      msg(d.note || d.error || 'The 3D view is not available right now.'); detail.dataset.view = 'none';
      if (d.note) { const dl = detail.querySelector('a.dlstep'); if (dl) dl.remove(); }     // nothing to download either
      return;
    }
    times.file = performance.now();
    let gltf;
    try { const v = await viewer(); gltf = await new v.GLTFLoader().loadAsync(d.mesh_url); }
    catch (e) { if (mine === partSeq) { msg('The 3D view is not available right now.'); detail.dataset.view = 'none'; } return; }
    if (mine !== partSeq) return;
    const { THREE, scene, renderer } = V;
    if (V3) { scene.remove(V3.model); V3.model.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
    const model = gltf.scene; model.rotation.x = -Math.PI / 2;        // CAD Z-up to three.js Y-up
    let tris = 0;
    model.traverse(o => {
      if (o.isLineSegments || o.isLine) { o.raycast = () => {}; o.material = new THREE.LineBasicMaterial({ color: 0x0A1428, transparent: true, opacity: 0.55 }); return; }
      if (!o.isMesh) return;
      tris += o.geometry.index ? o.geometry.index.count / 3 : 0;
      o.material = new THREE.MeshStandardMaterial({ color: 0xC9D1DC, metalness: 0.35, roughness: 0.42, envMapIntensity: 0.8,
        polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    });
    /* the drawn box, in the part's own (Z-up) coordinates, as read from the file's positions (the page check compares it) */
    const box = new THREE.Box3();
    model.traverse(o => { if (o.geometry) { o.geometry.computeBoundingBox(); box.union(o.geometry.boundingBox); } });
    scene.add(model);
    V3 = { model, triangles: tris, box: [box.min.x, box.max.x, box.min.y, box.max.y, box.min.z, box.max.z], url: d.mesh_url };
    const st = detail.querySelector('.stage');
    st.appendChild(renderer.domElement); V.ro.disconnect(); V.ro.observe(st); resize3d();
    frame(VIEWS.iso); msg('');
    renderer.render(scene, V.camera);
    times.drawn = performance.now();
    detail.dataset.view = 'ready';
    if (!V.raf) V.raf = requestAnimationFrame(loop);
  }

  /* ---- the assembly view: #design=<design> ---- */
  async function loadDesign(id) {
    const mine = ++partSeq;
    detail.hidden = false; delete detail.dataset.part; detail.dataset.view = 'none';
    detail.innerHTML = head('Assembly', '…', '', '') + `<div class="msg">Reading the catalogue…</div>`;
    wire(); markOpen();
    let r, d;
    try { r = await fetch('/api/catalogue/design?id=' + enc(id)); d = await r.json().catch(() => ({})); } catch (e) { r = null; d = {}; }
    if (mine !== partSeq) return;
    if (!r || !r.ok) { detail.querySelector('.msg').textContent = r && r.status === 404 ? 'This assembly is not in the catalogue.' : 'The catalogue is not available right now.'; return; }
    renderDesign(d);
  }
  function renderDesign(a) {
    fromDesign = { id: a.product_id, name: a.name || a.product_id };
    const lines = a.lines.map(x => { const e = x.envelope_mm || []; return `<tr><td><button type="button" class="lnk" data-part="${esc(x.part_id)}">${esc(x.label || x.ref)}</button><div class="sub">${esc(x.ref)}</div></td>` +
      `<td>${x.family ? `<span class="fam">${esc(x.family)}</span>` : ''}</td><td class="c">×<span class="num" data-k="l_count">${x.count}</span></td>` +
      `<td>${e[0] == null ? '—' : `<span class="num" data-k="l_env_a">${fmt(e[0], 1)}</span> × <span class="num" data-k="l_env_b">${fmt(e[1], 1)}</span> × <span class="num" data-k="l_env_c">${fmt(e[2], 1)}</span>`}</td>` +
      `<td>${x.volume_mm3 == null ? '—' : `<span class="num" data-k="l_volume">${fmt(x.volume_mm3, 0)}</span>`}</td></tr>`; }).join('');
    detail.innerHTML = head('Assembly', esc(a.name || a.product_id), 'rev ' + esc(a.revision ?? '—'),
        `<a class="act" href="${studio(a.product_id)}">Open in the studio</a>`) +
      (a.description ? `<div class="desc">${esc(a.description)}</div>` : '') +
      `<dl><dt>Parts</dt><dd><span class="num" data-k="a_parts">${a.parts}</span></dd><dt>Pieces</dt><dd><span class="num" data-k="a_pieces">${a.pieces}</span></dd>` +
      `<dt>Fits and contacts</dt><dd><span class="num" data-k="a_ifaces">${a.interfaces}</span></dd></dl>` +
      `<h3>Parts list</h3><table class="parts"><tr><th>Part</th><th>Family</th><th>Count</th><th>Size, mm</th><th>Volume, mm³</th></tr>${lines}</table>`;
    detail.dataset.design = a.product_id;
    wire();
    detail.querySelector('.x').focus({ preventScroll: true });
  }

  function closePart() {
    partSeq++; fromDesign = null;
    if (V) { cancelAnimationFrame(V.raf); V.raf = 0; V.ro.disconnect(); }
    detail.hidden = true; detail.innerHTML = ''; delete detail.dataset.part; delete detail.dataset.design; delete detail.dataset.view;
    if (openId() || openDesignId()) try { history.replaceState(history.state, '', location.pathname + location.search); } catch (e) {}
    markOpen();
    const back = backTo && results.querySelector(`.hit[data-part="${CSS.escape(backTo)}"] .nm`);
    if (back) back.focus({ preventScroll: true });
  }
  function fromHash() {
    const id = openId(), did = openDesignId();
    if (id) { backTo = id; if (fromDesign && !detail.dataset.design && !detail.dataset.part) fromDesign = null; loadPart(id); }
    else if (did) { loadDesign(did); }
    else if (!detail.hidden) closePart();
  }
  window.Catalogue = {
    /* open a part by its catalogue id (doc:object); the address becomes /catalogue#part=<id> (the list's hook, the part view) */
    openPart(id) {
      if (detail.dataset.design && fromDesign && detail.dataset.design !== fromDesign.id) fromDesign = null;
      if (!detail.dataset.design && !detail.dataset.part) fromDesign = null;
      if (openId() === id) loadPart(id); else location.hash = 'part=' + enc(id);
    },
    /* open an assembly's view: its numbers and parts list */
    openDesign(id) { if (openDesignId() === id) loadDesign(id); else location.hash = 'design=' + enc(id); },
    closePart, renderPart, loadPart, renderDesign, loadDesign,
    /* what the 3D view shows (the page check reads it): state, triangles, the drawn box in the part's coordinates, times (ms) */
    view3d: () => ({ state: detail.dataset.view || 'none', triangles: V3 ? V3.triangles : 0, box: V3 ? V3.box : null, url: V3 ? V3.url : null,
      numbers_ms: times.numbers ? times.numbers - times.start : null, file_ms: times.file ? times.file - times.start : null,
      drawn_ms: times.drawn ? times.drawn - times.start : null, camera: V ? V.camera.position.toArray() : null }),
    viewCmd,
    last: () => last
  };

  /* ---- wiring ---- */
  $('#find').addEventListener('submit', ev => { ev.preventDefault(); run(); });
  box.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 300); });
  box.addEventListener('keydown', ev => { if (ev.key === 'Escape' && box.value) { ev.preventDefault(); box.value = ''; run(); } });
  $('#filters').addEventListener('change', () => { readFilters(); run(); });
  $('#fToggle').addEventListener('click', () => {
    const on = !$('#filters').classList.contains('open');
    $('#filters').classList.toggle('open', on); $('#fToggle').setAttribute('aria-expanded', on ? 'true' : 'false');
  });
  $('#fClear').addEventListener('click', () => {
    box.value = ''; $('#fFamily').value = ''; $('#fMaterial').value = ''; $('#fSame').value = 'once'; $('#fSort').value = 'name';
    document.querySelectorAll('#filters input').forEach(i => { i.value = ''; });
    readFilters(); run();
  });
  document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => { if (state.kind !== b.dataset.kind) { state.kind = b.dataset.kind; run(); } }));
  $('#pPrev').addEventListener('click', () => { if (state.page > 0) { state.page--; run(true); window.scrollTo({ top: 0 }); } });
  $('#pNext').addEventListener('click', () => { state.page++; run(true); window.scrollTo({ top: 0 }); });
  window.addEventListener('hashchange', fromHash);
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !detail.hidden && document.activeElement !== box) closePart(); });

  async function loadFamilies() {
    try {
      const r = await fetch('/api/catalogue/families'); if (!r.ok) return;
      const d = await r.json();
      $('#mParts').textContent = d.parts.toLocaleString(LOC); $('#mDesigns').textContent = d.designs.toLocaleString(LOC);
      const sel = $('#fFamily'), keep = state.family;
      for (const f of d.families) { const o = document.createElement('option'); o.value = f.family; o.textContent = `${f.family} (${f.parts})`; sel.appendChild(o); }
      if (keep && !d.families.some(f => f.family === keep)) { const o = document.createElement('option'); o.value = keep; o.textContent = keep; sel.appendChild(o); }
      sel.value = keep;
    } catch (e) { /* the list still works without the family names */ }
  }
  async function loadMaterials() {
    try {
      const r = await fetch('/api/catalogue/materials'); if (!r.ok) return;
      const d = await r.json();
      const sel = $('#fMaterial'), keep = state.material;
      for (const m of d.materials || []) { const o = document.createElement('option'); o.value = m; o.textContent = m; sel.appendChild(o); }
      if (keep && !(d.materials || []).includes(keep)) { const o = document.createElement('option'); o.value = keep; o.textContent = keep; sel.appendChild(o); }
      sel.value = keep;
    } catch (e) { /* the list still works without the material names */ }
  }
  readUrl(); showState(); hint(CP.SEARCH_HINT, false);
  Promise.all([loadFamilies(), loadMaterials()]).then(() => showState());
  run(true);
  fromHash();
})();
</script>
</body>
</html>
