name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: What would you like Buildcore to do?
  - type: textarea
    id: example
    attributes:
      label: Example
      description: A drawing, BOM or part that shows what you mean (only files you can share).
